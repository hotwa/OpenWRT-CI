name: Container Runtime Test (RE-CS-02 / RE-CS-07)

# One experimental entry point for both supported container boards. The
# ordinary RE-Mesh and RE-CS-07 build workflows remain unchanged, and RE-SS-01
# is intentionally excluded from this workflow.
on:
  workflow_dispatch:
    inputs:
      TARGET:
        description: 'Target device to build'
        required: true
        type: choice
        options:
          - all
          - re-cs-02
          - re-cs-07
        default: all
      DEBUG_SSH:
        description: 'Hold runner with Tailscale SSH for live debugging'
        required: false
        type: boolean
        default: false
      CS02_LAN_IP:
        description: 'RE-CS-02 LAN IP'
        required: false
        default: '192.168.11.1'
      CS07_LAN_IP:
        description: 'RE-CS-07 LAN IP'
        required: false
        default: '192.168.10.1'
      CONTAINER_RUNTIME_MODE:
        description: 'Runtime source: latest prebuilt bundle, fallback, or OpenWrt package build'
        required: false
        type: choice
        options:
          - prebuilt
          - auto
          - openwrt
        default: prebuilt
      CONTAINER_RUNTIME_VERSION:
        description: 'Optional nerdctl release version; empty means latest stable'
        required: false
        default: ''

permissions:
  actions: write
  contents: write

jobs:
  re-cs-02:
    if: inputs.TARGET == 'all' || inputs.TARGET == 're-cs-02'
    uses: ./.github/workflows/WRT-CORE.yml
    secrets: inherit
    with:
      DEBUG_SSH: ${{ inputs.DEBUG_SSH }}
      WRT_CONFIG: IPQ60XX-RE-CS-02
      WRT_THEME: argon
      WRT_NAME: RE-CS-02-CONTAINER
      WRT_SSID: RE-CS-02
      WRT_IP: ${{ inputs.CS02_LAN_IP || '192.168.11.1' }}
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_COMMIT: a4638cd4389183f1a1fcad0441f491ca11c97757
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_BUILD_ONLY: true
      WRT_SPLIT_DEVICE_ARTIFACTS: false
      WRT_EXPECTED_DEVICE: jdcloud_re-cs-02
      WRT_REQUIRED_DEVICE: jdcloud_re-cs-02
      WRT_FEATURE_OVERLAY: true
      WRT_TAILSCALE_ROUTE_RECONCILE: true
      WRT_EMMC_DATA_PROVISIONING: true
      WRT_CONTAINER_RUNTIME_TEST: true
      WRT_CONTAINER_RUNTIME_MODE: ${{ inputs.CONTAINER_RUNTIME_MODE || 'prebuilt' }}
      WRT_CONTAINER_RUNTIME_VERSION: ${{ inputs.CONTAINER_RUNTIME_VERSION }}
      WRTBAK_FIRSTBOOT_AUTO_ENABLED: '0'
      WRTBAK_DEVICE_ALIAS: home-re-cs-02
      WRTBAK_PROXY_PROFILE: auto
      CI_NAME: RE-CS-02-CONTAINER-TEST
      RUNNER_LABELS: '["ubuntu-latest"]'
      JOB_TIMEOUT_MINUTES: 360

  re-cs-07:
    if: inputs.TARGET == 'all' || inputs.TARGET == 're-cs-07'
    uses: ./.github/workflows/WRT-CORE.yml
    secrets: inherit
    with:
      DEBUG_SSH: ${{ inputs.DEBUG_SSH }}
      WRT_CONFIG: IPQ60XX-RE-CS-07-NOWIFI
      WRT_THEME: argon
      WRT_NAME: RE-CS-07-CONTAINER
      WRT_SSID: RE-CS-07
      WRT_IP: ${{ inputs.CS07_LAN_IP || '192.168.10.1' }}
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_COMMIT: a4638cd4389183f1a1fcad0441f491ca11c97757
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_BUILD_ONLY: true
      WRT_SPLIT_DEVICE_ARTIFACTS: false
      WRT_EXPECTED_DEVICE: jdcloud_re-cs-07
      WRT_REQUIRED_DEVICE: jdcloud_re-cs-07
      WRT_FEATURE_OVERLAY: true
      WRT_TAILSCALE_ROUTE_RECONCILE: true
      WRT_EMMC_DATA_PROVISIONING: true
      WRT_CONTAINER_RUNTIME_TEST: true
      WRT_CONTAINER_RUNTIME_MODE: ${{ inputs.CONTAINER_RUNTIME_MODE || 'prebuilt' }}
      WRT_CONTAINER_RUNTIME_VERSION: ${{ inputs.CONTAINER_RUNTIME_VERSION }}
      WRTBAK_FIRSTBOOT_AUTO_ENABLED: '0'
      WRTBAK_DEVICE_ALIAS: home-re-cs-07
      CI_NAME: RE-CS-07-CONTAINER-TEST
      RUNNER_LABELS: '["ubuntu-latest"]'
      JOB_TIMEOUT_MINUTES: 360
