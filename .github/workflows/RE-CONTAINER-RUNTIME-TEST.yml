name: Container Runtime Test (RE-SS-01 / RE-CS-02 / RE-CS-07)

# One experimental entry point for all three supported container boards. The
# ordinary RE-Mesh and RE-CS-07 build workflows remain unchanged; this keeps
# the container runtime opt-in while sharing one tested bridge+nft overlay.
on:
  workflow_dispatch:
    inputs:
      TARGET:
        description: 'Target device to build'
        required: true
        type: choice
        options:
          - all
          - re-ss-01
          - re-cs-02
          - re-cs-07
        default: all
      DEBUG_SSH:
        description: 'Hold runner with Tailscale SSH for live debugging'
        required: false
        type: boolean
        default: false
      CS02_LAN_IP:
        description: 'RE-CS-02 LAN IP'
        required: false
        default: '192.168.11.1'
      CS07_LAN_IP:
        description: 'RE-CS-07 LAN IP'
        required: false
        default: '192.168.10.1'
      SS01_LAN_IP:
        description: 'RE-SS-01 LAN IP'
        required: false
        default: '192.168.12.1'
      CONTAINER_RUNTIME_MODE:
        description: 'Runtime source: latest prebuilt bundle, fallback, or OpenWrt package build'
        required: false
        type: choice
        options:
          - prebuilt
          - auto
          - openwrt
        default: prebuilt
      CONTAINER_RUNTIME_VERSION:
        description: 'Optional nerdctl release version; empty means latest stable'
        required: false
        default: ''

permissions:
  actions: read
  # WRT-CORE's compile job explicitly reduces this to contents: read; the
  # caller keeps the nested public-release ceiling valid even though this
  # build-only workflow never reaches that release job.
  contents: write

jobs:
  re-ss-01:
    if: inputs.TARGET == 'all' || inputs.TARGET == 're-ss-01'
    uses: ./.github/workflows/WRT-CORE.yml
    secrets:
      HEADSCALE_OPENWRT_AUTHKEY: ${{ secrets.HEADSCALE_OPENWRT_AUTHKEY }}
      HEADSCALE_CI_AUTHKEY: ${{ secrets.HEADSCALE_CI_AUTHKEY }}
      HEADSCALE_URL: ${{ secrets.HEADSCALE_URL }}
      MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
      MULTICA_SERVER_URL: ${{ secrets.MULTICA_SERVER_URL }}
      MULTICA_APP_URL: ${{ secrets.MULTICA_APP_URL }}
      MULTICA_WORKSPACE_ID: ${{ secrets.MULTICA_WORKSPACE_ID }}
      OPENWRT_DROPBEAR_AUTHORIZED_KEYS: ${{ secrets.OPENWRT_DROPBEAR_AUTHORIZED_KEYS }}
      OPENWRT_WAN_PPPOE_USERNAME: ${{ secrets.OPENWRT_WAN_PPPOE_USERNAME }}
      OPENWRT_WAN_PPPOE_PASSWORD: ${{ secrets.OPENWRT_WAN_PPPOE_PASSWORD }}
      NIKKI_SUBSCRIPTION_URL: ${{ secrets.NIKKI_SUBSCRIPTION_URL }}
      COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
      CLIPROXYAPI_API_KEY: ${{ secrets.CLIPROXYAPI_API_KEY }}
      CLIPROXYAPI_BASE_URL: ${{ secrets.CLIPROXYAPI_BASE_URL }}
      SAMBA_DEFAULT_PASSWORD: ${{ secrets.SAMBA_DEFAULT_PASSWORD }}
    with:
      DEBUG_SSH: ${{ inputs.DEBUG_SSH }}
      WRT_CONFIG: IPQ60XX-RE-SS-01
      WRT_THEME: argon
      WRT_NAME: RE-SS-01-CONTAINER
      WRT_SSID: RE-SS-01
      WRT_IP: ${{ inputs.SS01_LAN_IP || '192.168.12.1' }}
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_COMMIT: a4638cd4389183f1a1fcad0441f491ca11c97757
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_BUILD_ONLY: true
      WRT_SPLIT_DEVICE_ARTIFACTS: false
      WRT_EXPECTED_DEVICE: jdcloud_re-ss-01
      WRT_REQUIRED_DEVICE: jdcloud_re-ss-01
      WRT_FEATURE_OVERLAY: true
      WRT_TAILSCALE_ROUTE_RECONCILE: true
      WRT_EMMC_DATA_PROVISIONING: true
      WRT_CONTAINER_RUNTIME_TEST: true
      WRT_CONTAINER_RUNTIME_MODE: ${{ inputs.CONTAINER_RUNTIME_MODE || 'prebuilt' }}
      WRT_CONTAINER_RUNTIME_VERSION: ${{ inputs.CONTAINER_RUNTIME_VERSION }}
      CI_NAME: RE-SS-01-CONTAINER-TEST
      RUNNER_LABELS: '["ubuntu-latest"]'
      JOB_TIMEOUT_MINUTES: 360

  re-cs-02:
    if: inputs.TARGET == 'all' || inputs.TARGET == 're-cs-02'
    uses: ./.github/workflows/WRT-CORE.yml
    secrets:
      HEADSCALE_OPENWRT_AUTHKEY: ${{ secrets.HEADSCALE_OPENWRT_AUTHKEY }}
      HEADSCALE_CI_AUTHKEY: ${{ secrets.HEADSCALE_CI_AUTHKEY }}
      HEADSCALE_URL: ${{ secrets.HEADSCALE_URL }}
      MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
      MULTICA_SERVER_URL: ${{ secrets.MULTICA_SERVER_URL }}
      MULTICA_APP_URL: ${{ secrets.MULTICA_APP_URL }}
      MULTICA_WORKSPACE_ID: ${{ secrets.MULTICA_WORKSPACE_ID }}
      OPENWRT_DROPBEAR_AUTHORIZED_KEYS: ${{ secrets.OPENWRT_DROPBEAR_AUTHORIZED_KEYS }}
      OPENWRT_WAN_PPPOE_USERNAME: ${{ secrets.OPENWRT_WAN_PPPOE_USERNAME }}
      OPENWRT_WAN_PPPOE_PASSWORD: ${{ secrets.OPENWRT_WAN_PPPOE_PASSWORD }}
      NIKKI_SUBSCRIPTION_URL: ${{ secrets.NIKKI_SUBSCRIPTION_URL }}
      COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
      CLIPROXYAPI_API_KEY: ${{ secrets.CLIPROXYAPI_API_KEY }}
      CLIPROXYAPI_BASE_URL: ${{ secrets.CLIPROXYAPI_BASE_URL }}
      SAMBA_DEFAULT_PASSWORD: ${{ secrets.SAMBA_DEFAULT_PASSWORD }}
    with:
      DEBUG_SSH: ${{ inputs.DEBUG_SSH }}
      WRT_CONFIG: IPQ60XX-RE-CS-02
      WRT_THEME: argon
      WRT_NAME: RE-CS-02-CONTAINER
      WRT_SSID: RE-CS-02
      WRT_IP: ${{ inputs.CS02_LAN_IP || '192.168.11.1' }}
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_COMMIT: a4638cd4389183f1a1fcad0441f491ca11c97757
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_BUILD_ONLY: true
      WRT_SPLIT_DEVICE_ARTIFACTS: false
      WRT_EXPECTED_DEVICE: jdcloud_re-cs-02
      WRT_REQUIRED_DEVICE: jdcloud_re-cs-02
      WRT_FEATURE_OVERLAY: true
      WRT_TAILSCALE_ROUTE_RECONCILE: true
      WRT_EMMC_DATA_PROVISIONING: true
      WRT_CONTAINER_RUNTIME_TEST: true
      WRT_CONTAINER_RUNTIME_MODE: ${{ inputs.CONTAINER_RUNTIME_MODE || 'prebuilt' }}
      WRT_CONTAINER_RUNTIME_VERSION: ${{ inputs.CONTAINER_RUNTIME_VERSION }}
      CI_NAME: RE-CS-02-CONTAINER-TEST
      RUNNER_LABELS: '["ubuntu-latest"]'
      JOB_TIMEOUT_MINUTES: 360

  re-cs-07:
    if: inputs.TARGET == 'all' || inputs.TARGET == 're-cs-07'
    uses: ./.github/workflows/WRT-CORE.yml
    secrets:
      HEADSCALE_OPENWRT_AUTHKEY: ${{ secrets.HEADSCALE_OPENWRT_AUTHKEY }}
      HEADSCALE_CI_AUTHKEY: ${{ secrets.HEADSCALE_CI_AUTHKEY }}
      HEADSCALE_URL: ${{ secrets.HEADSCALE_URL }}
      MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
      MULTICA_SERVER_URL: ${{ secrets.MULTICA_SERVER_URL }}
      MULTICA_APP_URL: ${{ secrets.MULTICA_APP_URL }}
      MULTICA_WORKSPACE_ID: ${{ secrets.MULTICA_WORKSPACE_ID }}
      OPENWRT_DROPBEAR_AUTHORIZED_KEYS: ${{ secrets.OPENWRT_DROPBEAR_AUTHORIZED_KEYS }}
      OPENWRT_WAN_PPPOE_USERNAME: ${{ secrets.OPENWRT_WAN_PPPOE_USERNAME }}
      OPENWRT_WAN_PPPOE_PASSWORD: ${{ secrets.OPENWRT_WAN_PPPOE_PASSWORD }}
      NIKKI_SUBSCRIPTION_URL: ${{ secrets.NIKKI_SUBSCRIPTION_URL }}
      COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
      CLIPROXYAPI_API_KEY: ${{ secrets.CLIPROXYAPI_API_KEY }}
      CLIPROXYAPI_BASE_URL: ${{ secrets.CLIPROXYAPI_BASE_URL }}
      SAMBA_DEFAULT_PASSWORD: ${{ secrets.SAMBA_DEFAULT_PASSWORD }}
    with:
      DEBUG_SSH: ${{ inputs.DEBUG_SSH }}
      WRT_CONFIG: IPQ60XX-RE-CS-07-NOWIFI
      WRT_THEME: argon
      WRT_NAME: RE-CS-07-CONTAINER
      WRT_SSID: RE-CS-07
      WRT_IP: ${{ inputs.CS07_LAN_IP || '192.168.10.1' }}
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_COMMIT: a4638cd4389183f1a1fcad0441f491ca11c97757
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_BUILD_ONLY: true
      WRT_SPLIT_DEVICE_ARTIFACTS: false
      WRT_EXPECTED_DEVICE: jdcloud_re-cs-07
      WRT_REQUIRED_DEVICE: jdcloud_re-cs-07
      WRT_FEATURE_OVERLAY: true
      WRT_TAILSCALE_ROUTE_RECONCILE: true
      WRT_EMMC_DATA_PROVISIONING: true
      WRT_CONTAINER_RUNTIME_TEST: true
      WRT_CONTAINER_RUNTIME_MODE: ${{ inputs.CONTAINER_RUNTIME_MODE || 'prebuilt' }}
      WRT_CONTAINER_RUNTIME_VERSION: ${{ inputs.CONTAINER_RUNTIME_VERSION }}
      CI_NAME: RE-CS-07-CONTAINER-TEST
      RUNNER_LABELS: '["ubuntu-latest"]'
      JOB_TIMEOUT_MINUTES: 360
