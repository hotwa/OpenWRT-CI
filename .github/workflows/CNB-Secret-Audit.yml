# Manual, read-only audit of the build-domain secrets a CNB fallback needs.
#
# This workflow only runs on an explicit manual dispatch, never on push, tags,
# schedules or pull requests, and it compiles nothing. It reports secret *names*
# and a boolean presence flag per name; it never reads, prints, hashes or copies a
# value, and it never modifies GitHub secrets or the CNB cloud-secret repository.
#
# Output: the name inventory in the log and the unfilled template as an artifact
# (placeholders only), which the owner copies into
# b2233/cloud-secret projects/openwrt-ci/env.build.yml by hand.
name: CNB secret audit (manual, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: List build-domain secret names (never values)
        run: python3 Scripts/cnb_secret_inventory.py --audit

      - name: Report presence only (boolean set/unset per name)
        # Each variable holds the result of a `secrets.<NAME> != ''` comparison, i.e. a boolean.
        # The secret value is never placed in the environment, the log or a file.
        env:
          PRESENT_SAMBA_DEFAULT_PASSWORD: ${{ secrets.SAMBA_DEFAULT_PASSWORD != '' }}
          PRESENT_HEADSCALE_OPENWRT_AUTHKEY: ${{ secrets.HEADSCALE_OPENWRT_AUTHKEY != '' }}
          PRESENT_HEADSCALE_CI_AUTHKEY: ${{ secrets.HEADSCALE_CI_AUTHKEY != '' }}
          PRESENT_HEADSCALE_URL: ${{ secrets.HEADSCALE_URL != '' }}
          PRESENT_NIKKI_SUBSCRIPTION_URL: ${{ secrets.NIKKI_SUBSCRIPTION_URL != '' }}
          PRESENT_OPENWRT_DROPBEAR_AUTHORIZED_KEYS: ${{ secrets.OPENWRT_DROPBEAR_AUTHORIZED_KEYS != '' }}
          PRESENT_OPENWRT_WAN_PPPOE_USERNAME: ${{ secrets.OPENWRT_WAN_PPPOE_USERNAME != '' }}
          PRESENT_OPENWRT_WAN_PPPOE_PASSWORD: ${{ secrets.OPENWRT_WAN_PPPOE_PASSWORD != '' }}
          PRESENT_MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN != '' }}
          PRESENT_MULTICA_SERVER_URL: ${{ secrets.MULTICA_SERVER_URL != '' }}
          PRESENT_MULTICA_APP_URL: ${{ secrets.MULTICA_APP_URL != '' }}
          PRESENT_MULTICA_WORKSPACE_ID: ${{ secrets.MULTICA_WORKSPACE_ID != '' }}
          PRESENT_COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY != '' }}
          PRESENT_CLIPROXYAPI_API_KEY: ${{ secrets.CLIPROXYAPI_API_KEY != '' }}
          PRESENT_CLIPROXYAPI_BASE_URL: ${{ secrets.CLIPROXYAPI_BASE_URL != '' }}
        run: |
          set -euo pipefail
          echo 'presence only (set/unset); no value is read or printed'
          for name in \
            SAMBA_DEFAULT_PASSWORD HEADSCALE_OPENWRT_AUTHKEY HEADSCALE_CI_AUTHKEY HEADSCALE_URL \
            NIKKI_SUBSCRIPTION_URL OPENWRT_DROPBEAR_AUTHORIZED_KEYS \
            OPENWRT_WAN_PPPOE_USERNAME OPENWRT_WAN_PPPOE_PASSWORD \
            MULTICA_TOKEN MULTICA_SERVER_URL MULTICA_APP_URL MULTICA_WORKSPACE_ID \
            COMMANDCODE_API_KEY CLIPROXYAPI_API_KEY CLIPROXYAPI_BASE_URL
          do
            variable="PRESENT_${name}"
            if [ "${!variable}" = "true" ]; then
              printf '%s=set\n' "$name"
            else
              printf '%s=unset\n' "$name"
            fi
          done

      - name: Validate the unfilled template (placeholders only)
        run: python3 Scripts/cnb_secret_inventory.py --check .cnb/cloud-secret-env.build.template.yml

      - name: Upload the unfilled template (placeholders only)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cnb-cloud-secret-template
          path: .cnb/cloud-secret-env.build.template.yml
          retention-days: 14
