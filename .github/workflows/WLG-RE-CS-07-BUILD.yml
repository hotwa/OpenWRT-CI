name: WLG RE-CS-07 Build (OpenClash)

on:
  workflow_dispatch:
    inputs:
      DEBUG_SSH:
        description: 'Hold runner with Tailscale SSH for live debugging'
        required: false
        type: boolean
        default: false
      BUILD_TARGET:
        description: 'WLG device to compile'
        required: false
        type: choice
        default: re-cs-07
        options:
          - re-cs-07
          - re-ss-01
      LAN_IP:
        description: 'Router LAN IP (e.g. 192.168.50.1)'
        required: false
        default: '192.168.50.1'

permissions:
  actions: write
  contents: write

jobs:
  build:
    uses: ./.github/workflows/WRT-CORE.yml
    secrets:
      OPENWRT_DROPBEAR_AUTHORIZED_KEYS: ${{ secrets.OPENWRT_DROPBEAR_AUTHORIZED_KEYS }}
      HEADSCALE_CI_AUTHKEY: ${{ secrets.HEADSCALE_CI_AUTHKEY }}
      HEADSCALE_URL: ${{ secrets.HEADSCALE_URL }}
    with:
      DEBUG_SSH: ${{ inputs.DEBUG_SSH || false }}
      WRT_PROXY_PROFILE: openclash
      WRT_CONFIG: ${{ inputs.BUILD_TARGET == 're-ss-01' && 'IPQ60XX-RE-SS-01' || 'IPQ60XX-RE-CS-07-NOWIFI' }}
      WRT_THEME: argon
      WRT_NAME: ${{ inputs.BUILD_TARGET == 're-ss-01' && 'WLG-RE-SS-01' || 'WLG-RE-CS-07' }}
      WRT_SSID: ${{ inputs.BUILD_TARGET == 're-ss-01' && 'WLG-RE-SS-01' || 'WLG-RE-CS-07' }}
      WRT_IP: ${{ inputs.LAN_IP || '192.168.50.1' }}
      WRT_FEATURE_OVERLAY: true
      WRT_TAILSCALE_ROUTE_RECONCILE: true
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_COMMIT: 0fb9b10cb9df51fb076470e1dd93d1c30dd89d83
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_BUILD_ONLY: true
      WRT_EXPECTED_DEVICE: ${{ inputs.BUILD_TARGET == 're-ss-01' && 'jdcloud_re-ss-01' || 'jdcloud_re-cs-07' }}
      WRT_REQUIRED_DEVICE: ${{ inputs.BUILD_TARGET == 're-ss-01' && 'jdcloud_re-ss-01' || 'jdcloud_re-cs-07' }}
      # Same guarded first-boot eMMC -> /data layout as the RE-SS-01 gate.
      WRT_EMMC_DATA_PROVISIONING: true
      WRT_CONTAINER_RUNTIME_TEST: true
      WRTBAK_FIRSTBOOT_AUTO_ENABLED: '0'
      WRTBAK_DEVICE_ALIAS: ${{ inputs.BUILD_TARGET == 're-ss-01' && 'wlg-re-ss-01' || 'wlg-re-cs-07' }}
      CI_NAME: ${{ inputs.BUILD_TARGET == 're-ss-01' && 'WLG-RE-SS-01-BUILD' || 'WLG-RE-CS-07-BUILD' }}
      RUNNER_LABELS: '["ubuntu-latest"]'
      JOB_TIMEOUT_MINUTES: 360
