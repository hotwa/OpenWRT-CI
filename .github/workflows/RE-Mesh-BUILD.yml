name: RE Mesh Build (RE-SS-01 + RE-CS-02)

on:
  workflow_dispatch:
    inputs:
      DEBUG_SSH:
        description: 'Hold failed matrix runners with Tailscale SSH for live debugging'
        required: false
        type: boolean
        default: false
      BUILD_TARGET:
        description: 'Build both mesh devices, or only one device for a focused artifact check.'
        required: false
        type: choice
        options: [all, re-ss-01, re-cs-02]
        default: all
      RE_SS_01_LAN_IP:
        description: 'RE-SS-01 LAN IP (e.g. 192.168.12.1)'
        required: false
        type: string
        default: '192.168.12.1'
      RE_CS_02_LAN_IP:
        description: 'RE-CS-02 LAN IP (e.g. 192.168.11.1)'
        required: false
        type: string
        default: '192.168.11.1'
      WAN_PROTOCOL:
        description: 'WAN protocol for both artifacts: DHCP keeps defaults; PPPoE uses private repository secrets.'
        required: false
        type: choice
        default: dhcp
        options: [dhcp, pppoe]

permissions:
  actions: read
  # WRT-CORE lowers its build job to contents: read. This caller must permit
  # write as the maximum because GitHub validates the nested, conditional
  # WRT-RELEASE job before it evaluates WRT_BUILD_ONLY.
  contents: write

# One dispatch keeps both Wi-Fi JDCloud builds together in the Actions UI.
# These are explicit jobs rather than a filtered matrix: GitHub evaluates a
# reusable-workflow job's `if` before the matrix context exists. Each target
# remains fully isolated, so a focused RE-CS-02 run never allocates an
# RE-SS-01 runner or produces a second artifact.
jobs:
  re_ss_01:
    name: RE-SS-01
    if: inputs.BUILD_TARGET == 'all' || inputs.BUILD_TARGET == 're-ss-01'
    uses: ./.github/workflows/WRT-CORE.yml
    secrets:
      HEADSCALE_OPENWRT_AUTHKEY: ${{ secrets.HEADSCALE_OPENWRT_AUTHKEY }}
      HEADSCALE_CI_AUTHKEY: ${{ secrets.HEADSCALE_CI_AUTHKEY }}
      HEADSCALE_URL: ${{ secrets.HEADSCALE_URL }}
      MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
      MULTICA_SERVER_URL: ${{ secrets.MULTICA_SERVER_URL }}
      MULTICA_APP_URL: ${{ secrets.MULTICA_APP_URL }}
      MULTICA_WORKSPACE_ID: ${{ secrets.MULTICA_WORKSPACE_ID }}
      OPENWRT_DROPBEAR_AUTHORIZED_KEYS: ${{ secrets.OPENWRT_DROPBEAR_AUTHORIZED_KEYS }}
      OPENWRT_WAN_PPPOE_USERNAME: ${{ secrets.OPENWRT_WAN_PPPOE_USERNAME }}
      OPENWRT_WAN_PPPOE_PASSWORD: ${{ secrets.OPENWRT_WAN_PPPOE_PASSWORD }}
      NIKKI_SUBSCRIPTION_URL: ${{ secrets.NIKKI_SUBSCRIPTION_URL }}
      COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
      CLIPROXYAPI_API_KEY: ${{ secrets.CLIPROXYAPI_API_KEY }}
      CLIPROXYAPI_BASE_URL: ${{ secrets.CLIPROXYAPI_BASE_URL }}
      SAMBA_DEFAULT_PASSWORD: ${{ secrets.SAMBA_DEFAULT_PASSWORD }}
    with:
      DEBUG_SSH: ${{ inputs.DEBUG_SSH }}
      WRT_CONFIG: IPQ60XX-RE-SS-01
      WRT_THEME: argon
      WRT_NAME: RE-SS-01
      WRT_SSID: RE-SS-01
      WRT_IP: ${{ inputs.RE_SS_01_LAN_IP }}
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_COMMIT: a4638cd4389183f1a1fcad0441f491ca11c97757
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_BUILD_ONLY: true
      WRT_SPLIT_DEVICE_ARTIFACTS: false
      WRT_EXPECTED_DEVICE: jdcloud_re-ss-01
      WRT_REQUIRED_DEVICE: jdcloud_re-ss-01
      WRT_WAN_PROTOCOL: ${{ inputs.WAN_PROTOCOL || 'dhcp' }}
      WRT_FEATURE_OVERLAY: true
      WRT_TAILSCALE_ROUTE_RECONCILE: true
      WRT_EMMC_DATA_PROVISIONING: true
      WRT_CONTAINER_RUNTIME_TEST: true
      CI_NAME: RE-SS-01-BUILD
      RUNNER_LABELS: '["ubuntu-latest"]'
      JOB_TIMEOUT_MINUTES: 360

  re_cs_02:
    name: RE-CS-02
    if: inputs.BUILD_TARGET == 'all' || inputs.BUILD_TARGET == 're-cs-02'
    uses: ./.github/workflows/WRT-CORE.yml
    secrets:
      HEADSCALE_OPENWRT_AUTHKEY: ${{ secrets.HEADSCALE_OPENWRT_AUTHKEY }}
      HEADSCALE_CI_AUTHKEY: ${{ secrets.HEADSCALE_CI_AUTHKEY }}
      HEADSCALE_URL: ${{ secrets.HEADSCALE_URL }}
      MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
      MULTICA_SERVER_URL: ${{ secrets.MULTICA_SERVER_URL }}
      MULTICA_APP_URL: ${{ secrets.MULTICA_APP_URL }}
      MULTICA_WORKSPACE_ID: ${{ secrets.MULTICA_WORKSPACE_ID }}
      OPENWRT_DROPBEAR_AUTHORIZED_KEYS: ${{ secrets.OPENWRT_DROPBEAR_AUTHORIZED_KEYS }}
      OPENWRT_WAN_PPPOE_USERNAME: ${{ secrets.OPENWRT_WAN_PPPOE_USERNAME }}
      OPENWRT_WAN_PPPOE_PASSWORD: ${{ secrets.OPENWRT_WAN_PPPOE_PASSWORD }}
      NIKKI_SUBSCRIPTION_URL: ${{ secrets.NIKKI_SUBSCRIPTION_URL }}
      COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
      CLIPROXYAPI_API_KEY: ${{ secrets.CLIPROXYAPI_API_KEY }}
      CLIPROXYAPI_BASE_URL: ${{ secrets.CLIPROXYAPI_BASE_URL }}
      SAMBA_DEFAULT_PASSWORD: ${{ secrets.SAMBA_DEFAULT_PASSWORD }}
    with:
      DEBUG_SSH: ${{ inputs.DEBUG_SSH }}
      WRT_CONFIG: IPQ60XX-RE-CS-02
      WRT_THEME: argon
      WRT_NAME: RE-CS-02
      WRT_SSID: RE-CS-02
      WRT_IP: ${{ inputs.RE_CS_02_LAN_IP }}
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_COMMIT: a4638cd4389183f1a1fcad0441f491ca11c97757
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_BUILD_ONLY: true
      WRT_SPLIT_DEVICE_ARTIFACTS: false
      WRT_EXPECTED_DEVICE: jdcloud_re-cs-02
      WRT_REQUIRED_DEVICE: jdcloud_re-cs-02
      WRT_WAN_PROTOCOL: ${{ inputs.WAN_PROTOCOL || 'dhcp' }}
      WRT_FEATURE_OVERLAY: true
      WRT_TAILSCALE_ROUTE_RECONCILE: true
      WRT_EMMC_DATA_PROVISIONING: true
      WRT_CONTAINER_RUNTIME_TEST: true
      CI_NAME: RE-CS-02-BUILD
      RUNNER_LABELS: '["ubuntu-latest"]'
      JOB_TIMEOUT_MINUTES: 360
