# SPDX-License-Identifier: MIT
# The catalog resolves current upstream Pi/plugins only in a verified CI
# generation. Devices install signed generations; they never resolve npm.
name: Agent-Runtime-Bump

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report resolvable upstream changes without modifying, building or publishing'
        required: false
        type: boolean
        default: false
      force_release:
        description: 'Resolve current latest Pi/plugins, verify, then publish a new signed generation'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agent-runtime-bump
  cancel-in-progress: false

jobs:
  bump-and-release:
    name: Verify and publish app-layer runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          check-latest: false

      - name: Install release tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake git qemu-user qemu-user-static
          usign_commit=c4c72b1b07945ee192361dc751291a7c98d6adcd
          git init "$RUNNER_TEMP/usign-src"
          git -C "$RUNNER_TEMP/usign-src" remote add origin https://git.openwrt.org/project/usign.git
          git -C "$RUNNER_TEMP/usign-src" fetch --depth=1 origin "$usign_commit"
          git -C "$RUNNER_TEMP/usign-src" checkout --detach "$usign_commit"
          [ "$(git -C "$RUNNER_TEMP/usign-src" rev-parse HEAD)" = "$usign_commit" ]
          cmake -S "$RUNNER_TEMP/usign-src" -B "$RUNNER_TEMP/usign-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/usign-build" --parallel
          sudo install -m 0755 "$RUNNER_TEMP/usign-build/usign" /usr/local/bin/usign
          command -v usign
          docker run --rm --platform linux/arm64 alpine:3.20 uname -m | grep -qx aarch64

      - name: Require signing material for a publishable run
        if: inputs.dry_run != true
        env:
          AGENT_RUNTIME_USIGN_SECRET_KEY: ${{ secrets.AGENT_RUNTIME_USIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          [ -n "$AGENT_RUNTIME_USIGN_SECRET_KEY" ] || {
            echo "ERROR: AGENT_RUNTIME_USIGN_SECRET_KEY is required for a non-dry-run release" >&2
            exit 1
          }
          [ -s files/etc/agent-runtime/usign.pub ] || {
            echo "ERROR: files/etc/agent-runtime/usign.pub must contain the matching public key" >&2
            exit 1
          }
          [ "$GITHUB_REF_NAME" = main ] || {
            echo 'ERROR: a non-dry-run runtime release must run from main' >&2
            exit 1
          }

      - name: Resolve and apply app-layer bumps
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then mode=plan; else mode=apply; fi
          bash Scripts/bump_agent_runtime.sh "$mode" 2>&1 | tee "$RUNNER_TEMP/bump.log"

      - name: Set candidate runtime sequence
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          runtime_release="$(sed -n '1p' Scripts/node-agent-runtime/runtime-release)"
          echo "CANDIDATE_RUNTIME_RELEASE=$runtime_release" >> "$GITHUB_ENV"

      - name: Build latest arm64 musl candidate
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          command -v qemu-aarch64
          AGENT_RUNTIME_RELEASE="$CANDIDATE_RUNTIME_RELEASE" bash Scripts/build_agent_runtime_generation.sh --arch arm64 --output "$RUNNER_TEMP/generation/arm64"
          bash Scripts/package_agent_runtime_bundle.sh --arch arm64 --source "$RUNNER_TEMP/generation/arm64" --output "$RUNNER_TEMP/candidate-release" --runtime-release "$CANDIDATE_RUNTIME_RELEASE"

      - name: Build latest x64 musl candidate
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          AGENT_RUNTIME_RELEASE="$CANDIDATE_RUNTIME_RELEASE" bash Scripts/build_agent_runtime_generation.sh --arch x64 --output "$RUNNER_TEMP/generation/x64"
          bash Scripts/package_agent_runtime_bundle.sh --arch x64 --source "$RUNNER_TEMP/generation/x64" --output "$RUNNER_TEMP/candidate-release" --runtime-release "$CANDIDATE_RUNTIME_RELEASE"

      - name: Probe complete musl generations
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            case "$arch" in arm64) platform=linux/arm64 ;; x64) platform=linux/amd64 ;; esac
            docker run --rm --platform "$platform" \
              -v "$RUNNER_TEMP/generation/$arch:/generation:ro" \
              -v "$GITHUB_WORKSPACE/Scripts/verify_pi_extensions.js:/verify_pi_extensions.js:ro" \
              alpine:3.20 /bin/sh -ec '
              # The official musl Node binary links libgcc_s.so.1 and
              # libstdc++.so.6. OpenWrt provides both runtime libraries,
              # while the bare Alpine probe image does not.
              apk add --no-cache libgcc libstdc++
              export PATH=/generation/node/bin:/generation/uv:/generation/bin:$PATH
              node -p "process.versions.modules"
              uv --version
              pi --version
              cmdc --version
              multica --version
              cd /generation/node/lib/node_modules
              test -s /generation/node/lib/node_modules/command-code/dist/index.mjs
              node /verify_pi_extensions.js --directory /generation/node \
                --vendor-extension /generation/vendor/pi-plan-mode/plan-mode.ts
              NODE_PATH=/generation/node/lib/node_modules node -e \
                "require(\"@napi-rs/keyring\"); require(\"zigpty\");"
            '
          done

      - name: Compare verified latest candidate with stable channel
        id: changes
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Dry run reports source-controlled updates only; it does not construct a registry candidate.'
            exit 0
          fi
          if [ "${{ inputs.force_release }}" = "true" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'Forced publication of a fully verified latest-at-build candidate.'
            exit 0
          fi
          channel='https://github.com/hotwa/OpenWRT-CI/releases/download/agent-runtime-stable'
          mkdir -p "$RUNNER_TEMP/channel-check"
          if ! curl -fsSL "$channel/index.json" -o "$RUNNER_TEMP/channel-check/index.json" || \
             ! curl -fsSL "$channel/index.json.sig" -o "$RUNNER_TEMP/channel-check/index.json.sig" || \
             ! usign -V -p files/etc/agent-runtime/usign.pub -m "$RUNNER_TEMP/channel-check/index.json" -x "$RUNNER_TEMP/channel-check/index.json.sig"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'Stable signed channel is missing or invalid; publishing the verified candidate.'
            exit 0
          fi
          if ! node -e "const index=require(process.argv[1]); if (index.schema_version!==1 || index.release_tag!=='agent-runtime-stable' || !Number.isSafeInteger(index.runtime_release) || index.runtime_release<1) process.exit(1); for (const arch of ['arm64','x64']) { const r=index.releases?.[arch]; if (!r?.manifest || r.libc!=='musl') process.exit(1); console.log(arch+'\t'+r.manifest+'\t'+r.bundle); }" "$RUNNER_TEMP/channel-check/index.json" >"$RUNNER_TEMP/channel-check/assets.tsv"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'Stable signed channel index is incomplete; publishing the verified candidate.'
            exit 0
          fi
          changed=false
          while IFS=$'\t' read -r arch manifest bundle; do
            candidate="$RUNNER_TEMP/candidate-release/agent-runtime-${CANDIDATE_RUNTIME_RELEASE}-${arch}-musl.manifest.json"
            if ! curl -fsSL "$channel/$manifest" -o "$RUNNER_TEMP/channel-check/$manifest" || \
               ! curl -fsSL "$channel/$manifest.sig" -o "$RUNNER_TEMP/channel-check/$manifest.sig" || \
               ! usign -V -p files/etc/agent-runtime/usign.pub -m "$RUNNER_TEMP/channel-check/$manifest" -x "$RUNNER_TEMP/channel-check/$manifest.sig" || \
               ! curl -fsIL "$channel/$bundle" -o /dev/null || \
               ! test -s "$candidate" || \
               ! node -e "const fs=require('node:fs'); const [stable,candidate]=process.argv.slice(1); const a=JSON.parse(fs.readFileSync(stable)); const b=JSON.parse(fs.readFileSync(candidate)); process.exit(a.input_sha256===b.input_sha256 ? 0 : 1)" "$RUNNER_TEMP/channel-check/$manifest" "$candidate"; then
              changed=true
              break
            fi
          done < "$RUNNER_TEMP/channel-check/assets.tsv"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = true ]; then
            echo 'Verified latest candidate differs from the stable channel.'
          else
            echo 'Stable channel already matches the verified latest candidate.'
          fi

      - name: Advance immutable runtime sequence
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          bash Scripts/bump_agent_runtime.sh advance-release
          echo "RUNTIME_RELEASE=$(sed -n '1p' Scripts/node-agent-runtime/runtime-release)" >> "$GITHUB_ENV"

      - name: Package changed verified candidate
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            bash Scripts/package_agent_runtime_bundle.sh --arch "$arch" --source "$RUNNER_TEMP/generation/$arch" --output "$RUNNER_TEMP/release" --runtime-release "$RUNTIME_RELEASE"
          done

      - name: Verify manifests and write signed index input
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          bash Scripts/write_agent_runtime_index.sh --directory "$RUNNER_TEMP/release" --tag agent-runtime-stable

      - name: Run repository and release pipeline guards
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          bash tests/test_agent_runtime_policy.sh
          bash tests/test_agent_runtime_release_pipeline.sh

      - name: Sign index and manifests
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run != true
        env:
          AGENT_RUNTIME_USIGN_SECRET_KEY: ${{ secrets.AGENT_RUNTIME_USIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/agent-runtime-usign.key"
          umask 077
          printf '%s\n' "$AGENT_RUNTIME_USIGN_SECRET_KEY" > "$key"
          trap 'rm -f -- "$key"' EXIT HUP INT TERM
          for manifest in "$RUNNER_TEMP"/release/*.manifest.json; do
            bash Scripts/sign_agent_runtime_metadata.sh --key "$key" --public-key files/etc/agent-runtime/usign.pub --manifest "$manifest" --index "$RUNNER_TEMP/release/index.json"
          done

      - name: Commit verified runtime inputs before publishing
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Scripts/node-agent-runtime Scripts/fetch_multica_runtime.sh
          if git diff --cached --quiet; then
            echo 'No runtime input changes to commit; stable channel was repaired from committed inputs.'
            exit 0
          fi
          {
            echo 'chore(agent-runtime): publish verified app-layer generation'
            echo
            grep -E '^[[:space:]]+[^[:space:]]+[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+[[:space:]]+-> ' "$RUNNER_TEMP/bump.log" || true
          } > "$RUNNER_TEMP/commit-message.txt"
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - name: Publish signed complete stack release
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          # The pinned inputs are already on main.  If this stable-tag upload
          # stops partway through, the next run detects the incomplete signed
          # channel and repairs it from those committed inputs.
          bash Scripts/publish_agent_runtime_release.sh --repository "$GITHUB_REPOSITORY" --tag agent-runtime-stable --directory "$RUNNER_TEMP/release"

      - name: Write job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo '## Agent runtime bump and release'
            echo
            echo '```text'
            [ -f "$RUNNER_TEMP/bump.log" ] && cat "$RUNNER_TEMP/bump.log" || echo '(no bump output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
