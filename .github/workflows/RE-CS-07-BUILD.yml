name: RE-CS-07 Build Only

on:
  workflow_dispatch:
    inputs:
      LAN_IP:
        description: 'Router LAN IP (e.g. 192.168.12.1)'
        required: false
        default: '192.168.12.1'

permissions:
  actions: write
  contents: write

jobs:
  build:
    uses: ./.github/workflows/WRT-CORE.yml
    secrets: inherit
    with:
      WRT_CONFIG: IPQ60XX-RE-CS-07-NOWIFI
      WRT_THEME: argon
      WRT_NAME: RE-CS-07
      WRT_SSID: RE-CS-07
      WRT_WORD: 12345678
      WRT_IP: ${{ inputs.LAN_IP || '192.168.12.1' }}
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_COMMIT: a4638cd4389183f1a1fcad0441f491ca11c97757
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_BUILD_ONLY: true
      WRT_EXPECTED_DEVICE: jdcloud_re-cs-07
      WRT_REQUIRED_DEVICE: jdcloud_re-cs-07
      WRTBAK_FIRSTBOOT_AUTO_ENABLED: '0'
      WRTBAK_DEVICE_ALIAS: home-re-cs-07
      CI_NAME: RE-CS-07-BUILD
      RUNNER_LABELS: '["ubuntu-latest"]'
      JOB_TIMEOUT_MINUTES: 360
