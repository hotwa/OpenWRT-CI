name: RE-CS-07 Build Only

on:
  workflow_dispatch:
    inputs:
      DEBUG_SSH:
        description: 'Hold runner with Tailscale SSH for live debugging'
        required: false
        type: boolean
        default: false
      LAN_IP:
        description: 'Router LAN IP (e.g. 192.168.10.1)'
        required: false
        default: '192.168.10.1'
      WAN_PROTOCOL:
        description: 'WAN protocol: DHCP keeps the default; PPPoE uses private repository secrets.'
        required: false
        type: choice
        default: dhcp
        options: [dhcp, pppoe]

permissions:
  actions: read
  # The called WRT-CORE build job is read-only. GitHub nevertheless validates
  # its conditional nested release boundary before WRT_BUILD_ONLY is known.
  contents: write

jobs:
  build:
    uses: ./.github/workflows/WRT-CORE.yml
    secrets:
      HEADSCALE_OPENWRT_AUTHKEY: ${{ secrets.HEADSCALE_OPENWRT_AUTHKEY }}
      HEADSCALE_CI_AUTHKEY: ${{ secrets.HEADSCALE_CI_AUTHKEY }}
      HEADSCALE_URL: ${{ secrets.HEADSCALE_URL }}
      MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
      MULTICA_SERVER_URL: ${{ secrets.MULTICA_SERVER_URL }}
      MULTICA_APP_URL: ${{ secrets.MULTICA_APP_URL }}
      MULTICA_WORKSPACE_ID: ${{ secrets.MULTICA_WORKSPACE_ID }}
      OPENWRT_DROPBEAR_AUTHORIZED_KEYS: ${{ secrets.OPENWRT_DROPBEAR_AUTHORIZED_KEYS }}
      OPENWRT_WAN_PPPOE_USERNAME: ${{ secrets.OPENWRT_WAN_PPPOE_USERNAME }}
      OPENWRT_WAN_PPPOE_PASSWORD: ${{ secrets.OPENWRT_WAN_PPPOE_PASSWORD }}
      NIKKI_SUBSCRIPTION_URL: ${{ secrets.NIKKI_SUBSCRIPTION_URL }}
      COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
      CLIPROXYAPI_API_KEY: ${{ secrets.CLIPROXYAPI_API_KEY }}
      CLIPROXYAPI_BASE_URL: ${{ secrets.CLIPROXYAPI_BASE_URL }}
      SAMBA_DEFAULT_PASSWORD: ${{ secrets.SAMBA_DEFAULT_PASSWORD }}
    with:
      DEBUG_SSH: ${{ inputs.DEBUG_SSH }}
      WRT_CONFIG: IPQ60XX-RE-CS-07-NOWIFI
      WRT_THEME: argon
      WRT_NAME: RE-CS-07
      WRT_SSID: RE-CS-07
      WRT_IP: ${{ inputs.LAN_IP || '192.168.10.1' }}
      WRT_FEATURE_OVERLAY: true
      WRT_TAILSCALE_ROUTE_RECONCILE: true
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_COMMIT: a4638cd4389183f1a1fcad0441f491ca11c97757
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_BUILD_ONLY: true
      WRT_EXPECTED_DEVICE: jdcloud_re-cs-07
      WRT_REQUIRED_DEVICE: jdcloud_re-cs-07
      WRT_WAN_PROTOCOL: ${{ inputs.WAN_PROTOCOL || 'dhcp' }}
      # Same guarded first-boot eMMC -> /data layout as the RE-SS-01 gate.
      WRT_EMMC_DATA_PROVISIONING: true
      WRT_CONTAINER_RUNTIME_TEST: true
      CI_NAME: RE-CS-07-BUILD
      RUNNER_LABELS: '["ubuntu-latest"]'
      JOB_TIMEOUT_MINUTES: 360
