.dual_platform_quality: &dual_platform_quality
  name: Dual platform contract check
  docker:
    image: python:3.13-bookworm
  stages:
    - name: Validate shared compiler and workflow bindings
      timeout: 10m
      script: |
        unset CNB_TOKEN GITHUB_TOKEN GH_TOKEN
        python3 -m pip install --no-cache-dir -r ci/firmware-requirements.txt
        python3 Scripts/dual_ci_contract.py
        python3 -m pytest -q tests/test_dual_ci.py tests/test_cnb_replay_core.py tests/test_cnb_re_profile_preflight.py

# Shadow CI only. Build credentials import only on the explicit manual gate.
# No release, deployment or device access.
# Keep this branch-scoped until CNB runner and artifact contracts are verified.
"migration/cnb-shadow-20260926":
  push:
    - name: OpenWrt shadow runner and guard probe
      docker:
        image: ubuntu:24.04
      stages:
        - name: Inspect runner and run repository guards
          script: bash Scripts/cnb_shadow_probe.sh
    - name: Verify every enabled CNB build profile without GitHub API calls
      docker:
        image: python:3.13-bookworm
      stages:
        - name: Verify the pinned RE, CPE-5G and QCA profile inputs
          script: unset CNB_TOKEN GITHUB_TOKEN GH_TOKEN; python3 Scripts/cnb_re_profile_preflight.py
    - *dual_platform_quality
  # Manual pinned host toolchain probe; no secrets or firmware.
  web_trigger_re_host_runtime_probe:
    - name: Probe pinned CNB host Go and Node versions
      # The pinned official archives are x86_64 only, and CNB memory is
      # cpus x 2 GiB, so 8 cpus is the smallest request that still matches the
      # GitHub hosted runner's 16 GiB (4 vCPU / 16 GiB) without over-allocating.
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        image: python:3.13-bookworm
      stages:
        - name: Verify official archive hashes and installed host toolchains
          script: bash Scripts/cnb_host_runtime.sh
          timeout: 20m
  # Attachment smoke uses a synthetic text file; no credentials or firmware.
  web_trigger_re_attachment_probe:
    - name: Probe private repository commit attachments without firmware
      docker:
        image: python:3.13-bookworm
      stages:
        - name: Create synthetic test payload
          script: printf 'CNB attachment probe only (not firmware)\n' > ./cnb-attachment-probe.txt
        - name: Test CNB attachments plugin for manual custom events
          image: cnbcool/attachments@sha256:3000e40e6495209ef056c374234f83505525257f799eaf51c9dcf8a8235efdb0
          settings:
            attachments:
              ./cnb-attachment-probe.txt: 1
  # Manual, build-only private firmware. This branch has no release/CD/device job.
  # Imports are absent from push, scheduled, and read-only profile tasks.
  #
  # Fan-out contract: each enabled profile is its own pipeline under this single
  # manual event, so ONE button click starts every enabled profile in parallel.
  # Every pipeline here imports the same build credential file, runs on 32 amd64
  # CPUs (64 GiB at CNB's memory = cpus x 2 GiB rule) and uploads its own private
  # commit attachment. One full RE build is about 1h23m wall clock, i.e. roughly
  # 44 core-hours, so a click on three profiles costs about 130 core-hours and
  # runs them concurrently - which is why this event stays manual and why push,
  # cron and preflight tasks never import credentials.
  web_trigger_re_private_build:
    - name: Build private RE-CS-07 with pinned GitHub source (no deployment)
      imports:
        - https://cnb.cool/b2233/cloud-secret/-/blob/main/projects/openwrt-ci/env.build.yml
      # amd64 is mandatory: the Go/Node archives, the OpenWrt target and the
      # GitHub-parity assumption are all x86_64. 32 cpus (64 GiB at the CNB
      # memory = cpus x 2 GiB rule) is the configuration that finished the full
      # RE-CS-07 replay in 63 minutes in the devbox, i.e. inside the observed
      # 120 minute build-pipeline cap; the four-CPU GitHub-parity affinity pin is
      # opted out in the replay stage below for the same reason.
      runner:
        tags: cnb:arch:amd64
        cpus: 32
      docker:
        image: python:3.13-bookworm
      stages:
        - name: Fail closed on missing mandatory Samba build input
          script: |
            bash Scripts/cnb_re_private_input_gate.sh
            python3 Scripts/firmware_secret_gate.py re-cs-07
          timeout: 3m
        - name: Install same OpenWrt host dependencies on Debian bookworm
          script: bash Scripts/cnb_bootstrap_environment.sh
          timeout: 75m
        - name: Install checksum-pinned host Go 1.26 and Node 24.20
          script: bash Scripts/cnb_host_runtime.sh
          timeout: 20m
        - name: Install pinned workflow YAML parser
          script: python3 -m pip install --no-cache-dir --disable-pip-version-check --timeout 30 --retries 3 'PyYAML==6.0.3'
          timeout: 10m
        - name: Create non-root OpenWrt builder with disposable GitHub-like sudo
          script: bash Scripts/cnb_re_builder_user.sh
          timeout: 10m
        - name: Replay guarded GitHub build steps through private firmware package verification
          # native keeps every allocated CPU: nproc = 32 here, so the unchanged
          # `make -j$(nproc)` steps run -j32 instead of the GitHub four-CPU
          # parity default. The firmware bytes do not depend on the job count.
          script: runuser --preserve-environment -u cnbbuild -- env HOME=/home/cnbbuild CNB_REPLAY_CPU_PIN=native python3 -u Scripts/cnb_replay_core.py re-cs-07
          timeout: 11h
        - name: Upload verified private firmware to private commit attachments (14 days)
          image: cnbcool/attachments@sha256:3000e40e6495209ef056c374234f83505525257f799eaf51c9dcf8a8235efdb0
          settings:
            attachments:
              - ./wrt/upload/*
            ttl: 14
    - name: Build private RE-CS-02 with pinned GitHub source (no deployment)
