            ttl: 14
  # wlg-re-cs-07 / WLG-RE-CS-07
  # wlg
  api_trigger_re_build_wlg: &api_trigger_re_build_wlg
    - name: Build private WLG-RE-CS-07 with pinned GitHub source (single target, api trigger, no deployment)
      imports:
        - https://cnb.cool/b2233/cloud-secret/-/blob/main/projects/openwrt-ci/env.build.yml
      # Lab identity (192.168.50.1) of the same board and pin; same runner
      # contract as the RE entries. Its caller injects no device activation key.
      runner:
        tags: cnb:arch:amd64
        cpus: 32
      docker:
        image: python:3.13-bookworm
      stages:
        - name: Fail closed on missing mandatory Samba build input
          script: |
            bash Scripts/cnb_re_private_input_gate.sh
            python3 Scripts/firmware_secret_gate.py wlg-re-cs-07
          timeout: 3m
        - name: Install same OpenWrt host dependencies on Debian bookworm
          script: bash Scripts/cnb_bootstrap_environment.sh
          timeout: 75m
        - name: Install checksum-pinned host Go 1.26 and Node 24.20
          script: bash Scripts/cnb_host_runtime.sh
          timeout: 20m
        - name: Install pinned workflow YAML parser
          script: python3 -m pip install --no-cache-dir --disable-pip-version-check --timeout 30 --retries 3 'PyYAML==6.0.3'
          timeout: 10m
        - name: Create non-root OpenWrt builder with disposable GitHub-like sudo
          script: bash Scripts/cnb_re_builder_user.sh
          timeout: 10m
        - name: Replay guarded GitHub build steps through private firmware package verification
          script: runuser --preserve-environment -u cnbbuild -- env HOME=/home/cnbbuild CNB_REPLAY_CPU_PIN=native python3 -u Scripts/cnb_replay_core.py wlg-re-cs-07
          timeout: 11h
        - name: Upload verified private firmware to private commit attachments (14 days)
          image: cnbcool/attachments@sha256:3000e40e6495209ef056c374234f83505525257f799eaf51c9dcf8a8235efdb0
          settings:
            attachments:
              - ./wrt/upload/*
            ttl: 14
  # Manual, interactive long-compile dev environment (云原生开发). The observed
  # build-pipeline cap is 120 minutes, so the same private RE-CS-07 replay also
  # runs here: it consumes 云原生开发 quota instead of 云原生构建 quota, keeps every
  # allocated CPU, and only hides/streams the log of the detached build. The
  # import is the same build credential file as the manual build job; no release,
  # deployment or device access, and no other event may import secrets.
  vscode:
    - name: RE-CS-07 devbox compile (interactive, no release or device)
      imports:
        - https://cnb.cool/b2233/cloud-secret/-/blob/main/projects/openwrt-ci/env.build.yml
      runner:
        tags: cnb:arch:amd64
        cpus: 32
      services:
        - vscode
        - docker
      docker:
        image: python:3.13-bookworm
      stages:
        - name: Prepare dependencies, host toolchain and builder user
          script: |
            bash Scripts/cnb_re_private_input_gate.sh
            bash Scripts/cnb_bootstrap_environment.sh
            bash Scripts/cnb_host_runtime.sh
            python3 -m pip install --no-cache-dir --disable-pip-version-check --timeout 30 --retries 3 'PyYAML==6.0.3'
            bash Scripts/cnb_re_builder_user.sh
          timeout: 90m
        - name: Run the pinned RE-CS-07 replay inside the devbox
          script: bash Scripts/cnb_devbox_run.sh
          timeout: 12h
  # CNB crontab requires a literal branch, never a glob. Weekly report-only pilot:
  # Sunday 09:00 Asia/Shanghai, no secrets or privileged build identity.
  web_trigger_re_preflight:
    - name: Check every pinned CNB build profile (RE, CPE-5G, QCA, WLG)
      docker:
        image: python:3.13-bookworm
      stages:
        - name: Validate original workflow pins and device configs
          script: unset CNB_TOKEN GITHUB_TOKEN GH_TOKEN; python3 Scripts/cnb_re_profile_preflight.py
          timeout: 3m
  "crontab: 0 9 * * 0":
    - name: Weekly read-only upstream NSS and kernel drift report
      docker:
        image: python:3.13-bookworm
      stages:
        - name: Compare pinned sources to upstream history (no pin changes)
          script: unset CNB_TOKEN GITHUB_TOKEN GH_TOKEN; python3 Scripts/cnb_upstream_report.py
          timeout: 8m

main:
  push:
    - *dual_platform_quality
  pull_request:
    - *dual_platform_quality
  web_trigger_re_build_cs07: *web_trigger_re_build_cs07
  api_trigger_re_build_cs07: *api_trigger_re_build_cs07
  web_trigger_re_build_cs02: *web_trigger_re_build_cs02
  api_trigger_re_build_cs02: *api_trigger_re_build_cs02
  web_trigger_re_build_ss01: *web_trigger_re_build_ss01
  api_trigger_re_build_ss01: *api_trigger_re_build_ss01
  web_trigger_re_build_wlg: *web_trigger_re_build_wlg
  api_trigger_re_build_wlg: *api_trigger_re_build_wlg
  web_trigger_re_build_cpe5g: *web_trigger_re_build_cpe5g
  api_trigger_re_build_cpe5g: *api_trigger_re_build_cpe5g
  web_trigger_re_build_cpe5g_configonly: *web_trigger_re_build_cpe5g_configonly
  api_trigger_re_build_cpe5g_configonly: *api_trigger_re_build_cpe5g_configonly
  web_trigger_re_build_qca_no: *web_trigger_re_build_qca_no
  api_trigger_re_build_qca_no: *api_trigger_re_build_qca_no
  web_trigger_re_build_qca_yes: *web_trigger_re_build_qca_yes
  api_trigger_re_build_qca_yes: *api_trigger_re_build_qca_yes
# Other branches receive checks only; no build secrets, releases or device access.
$:
