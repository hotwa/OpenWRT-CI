# Build-domain secrets for b2233/cloud-secret projects/openwrt-ci/env.build.yml
# Unfilled template: values are placeholders, never real credentials.
#
# Generated by Scripts/cnb_secret_inventory.py --write; validated by
# tests/test_cnb_secret_inventory.py. Fill the values by hand in the CNB
# secret repository; never commit a filled copy here.
#
# Placeholder semantics: the CNB replay treats <...> as absent, so a
# placeholder can never be used as a credential.
#
# Scope: build domain only. Deployment, release and backup credentials are
# deliberately absent (see the comments at the end of this file).

# ACL the owner maintains on that file (keep as reviewed):
allow_slugs:
  - b2233/openwrt-ci
allow_events:
  - web_trigger_re_private_build
  - vscode
allow_branches:
  - main
  - migration/cnb-shadow-20260926

# Required by CNB profiles: an empty or placeholder value fails the build
# closed instead of producing a silently different firmware.
# required by: cpe5g-a, cpe5g-b, qca-ipq60xx-wifi-no, qca-ipq60xx-wifi-yes
# Headscale device preauth key embedded by CPE-5G and QCA builds
HEADSCALE_OPENWRT_AUTHKEY: "<FILL:required>"

# required by: cpe5g-a, cpe5g-b, cpe5g-b-configonly, qca-ipq60xx-wifi-no, qca-ipq60xx-wifi-yes, re-cs-02, re-cs-07, re-ss-01, wlg-re-cs-07
# Samba build credential used by every firmware profile
SAMBA_DEFAULT_PASSWORD: "<FILL:required>"

# Optional: an empty value reproduces the GitHub caller's degradation path.
# used by: CPE-5G.yml, QCA-6.18-VIKINGYFY.yml, RE-CONTAINER-RUNTIME-TEST.yml, RE-CS-07-BUILD.yml, RE-Mesh-BUILD.yml, WLG-RE-CS-07-BUILD.yml, WRT-CORE.yml
# Pi CliProxyAPI provider configuration
CLIPROXYAPI_API_KEY: "<FILL:optional>"

# used by: CPE-5G.yml, QCA-6.18-VIKINGYFY.yml, RE-CONTAINER-RUNTIME-TEST.yml, RE-CS-07-BUILD.yml, RE-Mesh-BUILD.yml, WLG-RE-CS-07-BUILD.yml, WRT-CORE.yml
# Pi CliProxyAPI provider configuration
CLIPROXYAPI_BASE_URL: "<FILL:optional>"

# used by: CPE-5G.yml, QCA-6.18-VIKINGYFY.yml, RE-CONTAINER-RUNTIME-TEST.yml, RE-CS-07-BUILD.yml, RE-Mesh-BUILD.yml, WLG-RE-CS-07-BUILD.yml, WRT-CORE.yml
# Pi CommandCode provider configuration
COMMANDCODE_API_KEY: "<FILL:optional>"

# used by: CPE-5G.yml, QCA-6.18-VIKINGYFY.yml, RE-CONTAINER-RUNTIME-TEST.yml, RE-CS-07-BUILD.yml, RE-Mesh-BUILD.yml, WRT-CORE.yml
# Multica app endpoint
MULTICA_APP_URL: "<FILL:optional>"

# used by: CPE-5G.yml, QCA-6.18-VIKINGYFY.yml, RE-CONTAINER-RUNTIME-TEST.yml, RE-CS-07-BUILD.yml, RE-Mesh-BUILD.yml, WRT-CORE.yml
# Multica endpoint
MULTICA_SERVER_URL: "<FILL:optional>"

# used by: CPE-5G.yml, QCA-6.18-VIKINGYFY.yml, RE-CONTAINER-RUNTIME-TEST.yml, RE-CS-07-BUILD.yml, RE-Mesh-BUILD.yml, WRT-CORE.yml
# Multica enrollment token
MULTICA_TOKEN: "<FILL:optional>"

# used by: CPE-5G.yml, QCA-6.18-VIKINGYFY.yml, RE-CONTAINER-RUNTIME-TEST.yml, RE-CS-07-BUILD.yml, RE-Mesh-BUILD.yml, WRT-CORE.yml
# Multica workspace identifier
MULTICA_WORKSPACE_ID: "<FILL:optional>"

# used by: CPE-5G.yml, QCA-6.18-VIKINGYFY.yml, RE-CONTAINER-RUNTIME-TEST.yml, RE-CS-07-BUILD.yml, RE-Mesh-BUILD.yml, WLG-RE-CS-07-BUILD.yml, WRT-CORE.yml
# Nikki subscription URL injected at build time
NIKKI_SUBSCRIPTION_URL: "<FILL:optional>"

# used by: CPE-5G.yml, QCA-6.18-VIKINGYFY.yml, RE-CONTAINER-RUNTIME-TEST.yml, RE-CS-07-BUILD.yml, RE-Mesh-BUILD.yml, WLG-RE-CS-07-BUILD.yml, WRT-CORE.yml
# extra SSH keys injected into the overlay
OPENWRT_DROPBEAR_AUTHORIZED_KEYS: "<FILL:optional>"

# used by: CPE-5G.yml, QCA-6.18-VIKINGYFY.yml, RE-CONTAINER-RUNTIME-TEST.yml, RE-CS-07-BUILD.yml, RE-Mesh-BUILD.yml, WLG-RE-CS-07-BUILD.yml, WRT-CORE.yml
# only needed when a profile builds with WAN_PROTOCOL=pppoe
OPENWRT_WAN_PPPOE_PASSWORD: "<FILL:optional>"

# used by: CPE-5G.yml, QCA-6.18-VIKINGYFY.yml, RE-CONTAINER-RUNTIME-TEST.yml, RE-CS-07-BUILD.yml, RE-Mesh-BUILD.yml, WLG-RE-CS-07-BUILD.yml, WRT-CORE.yml
# only needed when a profile builds with WAN_PROTOCOL=pppoe
OPENWRT_WAN_PPPOE_USERNAME: "<FILL:optional>"

# Not used by the CNB build (names only; never add them here):
#   GH_PAT                           GitHub API automation credential; not a build credential
#   HEADSCALE_CI_AUTHKEY             GitHub CI debug hold only; not replayed by the CNB build
#   HEADSCALE_URL                    GitHub CI debug hold only; stripped from the CNB builder environment

# Forbidden here (deployment/release/backup domain, names only):
#   AGENT_RUNTIME_USIGN_SECRET_KEY   agent runtime signing/release
#   FIRMWARE_CD_KNOWN_HOSTS          firmware-cd environment (deployment)
#   FIRMWARE_CD_SSH_PRIVATE_KEY      firmware-cd environment (deployment)
#   WRTBAK_HOME_PROXY_URL            device backup proxy
#   WRTBAK_OFFICE_PROXY_URL          device backup proxy
#   WRTBAK_R2_ACCESS_KEY_ID          device backup object storage
#   WRTBAK_R2_BUCKET                 device backup object storage
#   WRTBAK_R2_ENDPOINT               device backup object storage
#   WRTBAK_R2_PREFIX                 device backup object storage
#   WRTBAK_R2_REGION                 device backup object storage
#   WRTBAK_R2_SECRET_ACCESS_KEY      device backup object storage
#   GITHUB_TOKEN                     GitHub Actions built-in, not transferable

# Reconciliation notes (names only):
#   present in the GitHub inventory but referenced by no workflow: GH_PAT, WRTBAK_HOME_PROXY_URL, WRTBAK_OFFICE_PROXY_URL, WRTBAK_R2_ACCESS_KEY_ID, WRTBAK_R2_BUCKET, WRTBAK_R2_ENDPOINT, WRTBAK_R2_PREFIX, WRTBAK_R2_REGION, WRTBAK_R2_SECRET_ACCESS_KEY
#   referenced by workflows but absent from the repository secret list: MULTICA_APP_URL, MULTICA_SERVER_URL, OPENWRT_WAN_PPPOE_PASSWORD, OPENWRT_WAN_PPPOE_USERNAME
#   (observed unset at 2026-09-27; leave them empty to match GitHub)
