# Shadow migration only. Buttons are visible solely on the isolation branch.
# Only the explicit private-build input gate may import build credentials.
# No device operations, release, or deployment.
branch:
  - reg: ^migration/cnb-shadow-20260926$
    buttons:
      - name: Check three RE build profiles (no firmware)
        description: Verify pinned source, device configs and build-only flags
        event: web_trigger_re_preflight
      - name: Probe pinned host Go and Node (no firmware)
        description: Download official SHA256-pinned Go 1.26.0 and Node 24.20.0 host tools
        event: web_trigger_re_host_runtime_probe
      - name: Probe private attachment plugin (synthetic text only)
        description: Verify manual-event commit attachments before any firmware build
        event: web_trigger_re_attachment_probe
      - name: Check private RE build input (no firmware)
        description: Manually check the cloud-secret import and mandatory Samba field; never print values
        event: web_trigger_re_private_build
